[project]
name = "stackwatch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "dnspython>=2.6.0",
    "clickhouse-connect>=0.7.0",
    "openai>=1.50.0",
    "semver>=3.0.0",
    "cvss>=3.0",
    "pyyaml>=6.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit so CI and local runs agree regardless of ruff version defaults.
# E501 is left out: line length is a formatting concern, not a lint gate.
select = [
    "E4", "E7", "E9",  # pycodestyle errors (imports, statements, syntax)
    "F",               # pyflakes
    "I",               # import sorting
    "B",               # bugbear
    "UP",              # pyupgrade
    "C4",              # comprehensions
    "DTZ002", "DTZ003", "DTZ004",  # naive "now"/utc helpers
    "BLE",             # blind except
    "S110", "S112",    # silent try/except pass and continue
    "PLW1510",         # subprocess.run without explicit check
    "PLR0402",         # manual from-import
    "FURB",
    "ISC004",
    "PERF402",
    "SIM103",
    "EXE",
    "RUF100",          # unused noqa
]
