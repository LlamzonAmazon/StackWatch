name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install
        run: uv venv --python 3.12 && uv pip install -r pyproject.toml --extra dev
      - name: Ruff
        run: .venv/bin/ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install
        run: uv venv --python 3.12 && uv pip install -r pyproject.toml --extra dev
      # No ClickHouse, network, Node or Semgrep needed. The 3 Semgrep-backed
      # tests skip themselves when the CLI is absent.
      - name: Pytest
        run: .venv/bin/python -m pytest -q
